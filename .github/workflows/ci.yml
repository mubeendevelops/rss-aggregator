name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go build ./...
      - run: go vet ./...

  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rss-aggregator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rss-aggregator"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      PORT: "8080"
      DB_URL: postgres://postgres:postgres@localhost:5432/rss-aggregator?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run migrations
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@latest
          goose -dir sql/schema postgres "$DB_URL" up
      - name: Smoke test
        run: |
          go build -o bin/rss-aggregator ./cmd/rss-aggregator
          ./bin/rss-aggregator > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf "http://localhost:$PORT/v1/healthz" > /dev/null && break
            sleep 1
          done
          ./scripts/smoke.sh
      - name: Server log
        if: always()
        run: cat server.log || true

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
